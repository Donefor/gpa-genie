<!DOCTYPE html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSE GPA Calculator</title>
    <meta name="description" content="GPA calculator and grade statistics for the Bachelor in Business and Economics at the Stockholm School of Economics." />
    <meta name="author" content="SSE GPA Calculator" />
    <meta name="theme-color" content="#8fad8a" />

    <!-- SVG for browsers that take it, .ico as the fallback crawlers ask for -->
    <link rel="icon" href="/icon-small.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Absolute URLs: crawlers do not resolve relative ones reliably -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SSE GPA Calculator" />
    <meta property="og:url" content="https://ssegpa.com/" />
    <meta property="og:title" content="SSE GPA Calculator" />
    <meta property="og:description" content="Plan your grade point average and see how courses at the Stockholm School of Economics have actually been graded." />
    <meta property="og:image" content="https://ssegpa.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SSE GPA Calculator" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SSE GPA Calculator" />
    <meta name="twitter:description" content="Plan your grade point average and see how courses at the Stockholm School of Economics have actually been graded." />
    <meta name="twitter:image" content="https://ssegpa.com/og-image.png" />

    <!--
      Hotjar and Google Analytics are deliberately not loaded here. They set
      cookies, so they are injected at runtime only once the visitor has
      consented; see src/lib/consent.ts.
    -->
  </head>

  <body>
    <div id="root"></div>
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
