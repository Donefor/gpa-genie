<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" fill="#8fad8a"/>
  <!-- Back sheet, tipped left -->
  <g transform="rotate(-9 50 52)">
    <rect x="22" y="24" width="44" height="58" rx="4"
          fill="#ffffff" fill-opacity="0.55" stroke="#3e3a35" stroke-width="4.5"/>
  </g>
  <!-- Front sheet -->
  <g transform="rotate(5 52 52)">
    <rect x="32" y="20" width="44" height="60" rx="4"
          fill="#ffffff" stroke="#3e3a35" stroke-width="5"/>
    <!-- Ruled lines: they disappear below 32px, which is fine -->
    <path d="M41 34 H67 M41 43 H63" stroke="#3e3a35" stroke-width="4"
          stroke-linecap="round" opacity="0.55"/>
    <!-- The mark, bold enough to survive 16px -->
    <path d="M42 60 L50 68 L67 49" fill="none" stroke="#3e3a35"
          stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
